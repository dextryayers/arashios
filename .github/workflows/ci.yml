name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3

      - name: Shell syntax
        run: |
          bash -n build.sh
          bash -n scripts/*.sh
          bash -n tests/*.sh

      - name: ShellCheck
        run: shellcheck -x build.sh scripts/*.sh tests/*.sh

      - name: Python syntax
        run: python3 -m py_compile scripts/*.py

      - name: Generate design tokens
        run: ./scripts/generate-tokens.py

      - name: Verify design tokens are current
        run: ./scripts/generate-tokens.py --check

      - name: Generate brand assets
        run: ./scripts/generate-brand-assets.py

      - name: Verify brand assets are current
        run: ./scripts/generate-brand-assets.py --check

      - name: Validate build configuration
        run: ./scripts/validate-config.sh

      - name: Validate documentation
        run: ./scripts/check-docs.sh

      - name: Validate requirement traceability
        run: ./scripts/check-traceability.py

  config-matrix:
    name: live-build config matrix
    runs-on: ubuntu-24.04
    container: debian:12
    needs: lint
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            isolinux syslinux-common syslinux-utils syslinux-efi \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Validate supported combinations
        run: ./tests/config-matrix.sh
