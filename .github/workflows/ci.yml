name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3 python3-yaml python3-gi \
            gir1.2-gtk-3.0 gir1.2-gtk-4.0 libgtk-4-1 dconf-cli dpkg-dev \
            python3-pip golang rustc nodejs gcc g++ make

      - name: Shell syntax
        run: |
          bash -n build.sh
          bash -n scripts/*.sh
          bash -n tests/*.sh

      - name: ShellCheck
        run: shellcheck -x build.sh scripts/*.sh tests/*.sh

      - name: Python syntax
        run: python3 -m py_compile scripts/*.py

      - name: Generate design tokens
        run: ./scripts/generate-tokens.py

      - name: Verify design tokens are current
        run: ./scripts/generate-tokens.py --check

      - name: Generate brand assets
        run: ./scripts/generate-brand-assets.py

      - name: Verify brand assets are current
        run: ./scripts/generate-brand-assets.py --check

      - name: Generate Kage theme
        run: ./scripts/generate-theme.py

      - name: Verify Kage theme is current
        run: ./scripts/generate-theme.py --check

      - name: Validate theme assets
        run: ./tests/theme.sh

      - name: Validate desktop integration
        run: ./tests/desktop-matrix.sh

      - name: Validate branding package
        run: ./tests/branding-package.sh

      - name: Generate toolstack catalog
        run: ./scripts/generate-toolstack.py

      - name: Verify toolstack catalog is current
        run: ./scripts/generate-toolstack.py --check

      - name: Generate toolchain catalog
        run: ./scripts/generate-toolchain.py

      - name: Verify toolchain catalog is current
        run: ./scripts/generate-toolchain.py --check

      - name: Validate toolstack and vendor manifests
        run: ./scripts/check-toolstack.py

      - name: Validate wordlists
        run: ./scripts/check-wordlists.py

      - name: Validate license metadata
        run: ./scripts/check-licenses.py

      - name: Validate toolchain lock
        run: ./scripts/refresh-toolchain-lock.py --check

      - name: Validate toolstack behaviour
        run: ./tests/toolstack.sh

      - name: Validate coding environment
        run: ./tests/coding.sh

      - name: Validate daily use configuration
        run: ./tests/daily.sh

      - name: Validate installer and recovery
        run: ./tests/installer.sh

      - name: Build package set
        run: |
          ./scripts/build-branding-package.sh
          python3 ./scripts/build-packages.py --all

      - name: Build local repository
        run: python3 ./scripts/build-repo.py --packages build/packages --output repo/public

      - name: Validate packaging standard
        run: python3 ./scripts/check-packages.py

      - name: Validate offline repository
        run: ./tests/repo-offline.sh

      - name: Validate hardening checklist
        run: python3 ./scripts/check-hardening.py --config

      - name: Validate compliance
        run: python3 ./scripts/check-compliance.py

      - name: Generate and validate SBOM
        run: |
          python3 ./scripts/generate-sbom.py --output build/arashios.sbom.json
          python3 ./scripts/check-sbom.py build/arashios.sbom.json

      - name: Validate upgrade path
        run: ./tests/upgrade-path.sh

      - name: Validate build configuration
        run: ./scripts/validate-config.sh

      - name: Validate documentation
        run: ./scripts/check-docs.sh

      - name: Validate requirement traceability
        run: ./scripts/check-traceability.py

  config-matrix:
    name: live-build config matrix
    runs-on: ubuntu-24.04
    container: debian:12
    needs: lint
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            isolinux syslinux-common syslinux-utils syslinux-efi \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Validate supported combinations
        run: ./tests/config-matrix.sh
