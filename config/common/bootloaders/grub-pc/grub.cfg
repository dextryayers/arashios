# ArashiOS Kage live GRUB configuration.
# Generated entries are inserted at @LINUX_LIVE@ by live-build.

source /boot/grub/config.cfg

# Live boot
@LINUX_LIVE@

# Serial console validation entry. The default live entry already carries the
# serial console kernel arguments; this entry makes the path explicit for QA.
menuentry "ArashiOS serial console (ttyS0)" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ console=tty0 console=ttyS0,115200
	initrd @INITRD_LIVE@
}

# Installer (if any)
if @ENABLE_INSTALL_MENU@; then
	source /boot/grub/install_start.cfg

	submenu 'Advanced install options...' --hotkey=a {
		source /boot/grub/theme.cfg
		source /boot/grub/install.cfg
	}
fi

submenu 'Utilities...' --hotkey=u {
	source /boot/grub/theme.cfg

	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" {
			fwsetup
		}
	fi
}
