set default=0
set timeout=5

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Prefer the native Kage composition. The generated GRUB background is
# 1024x768, so use that mode first and let firmware fall back if unavailable.
if loadfont $font ; then
    set gfxmode=1024x768,800x600,auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

# ArashiOS intentionally has no boot beep or startup sound.
