# ArashiOS power policy for TLP.
# Values are safe defaults for laptops and desktops alike.

# Charge thresholds
START_CHARGE_THRESH=75
STOP_CHARGE_THRESH=80

# CPU
CPU_SCALING_GOVERNOR=powersave
CPU_SCALING_MIN_FREQ=0
CPU_SCALING_MAX_FREQ=0
CPU_ENERGY_PERF_BIAS=balance-performance
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Platform
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced
PCIE_ASPM=on
RUNTIME_PM=on
RUNTIME_PM_USE_AUTOSUSPEND=1

# Devices
RUNTIME_SUSPEND=1
USB_AUTOSUSPEND=1
WIFI_PWR_ON_BAT=1
SOUND_POWER_SAVE=1

# Energy estimation
ESTIMATE_ENERGY=1
