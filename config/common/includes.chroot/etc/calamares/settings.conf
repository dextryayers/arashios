---
# ArashiOS installer settings for Calamares.
# The branding name must match the directory in /usr/share/calamares/branding.

branding: arashios

installation:
  module: installation
  hideSplashScreen: false
  hideSelection: false
  allowUnauthenticated: false
  org.name: ArashiOS Project
  org.url: https://arashios.example
  product.name: ArashiOS
  product.version: "@VERSION@"
  product.generic: false
  product.url: https://arashios.example
  userIsRoot: false
  bootloaderEntryName: ArashiOS
  autologinSession: false
  autologinUser: arashi
  doNotStorePassword: false
  checkVersion: false
  hostname: arashios

modules: /etc/calamares/modules.conf
