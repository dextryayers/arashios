---
# ArashiOS installation sequence.
# The order follows the Calamares job model: view modules ask the user,
# job modules write the target system.

sequence:
  - welcome
  - locale
  - localecfg
  - keyboard
  - partition
  - mount
  - luksbootkeyfile
  - users
  - displaymanager
  - packages
  - fstab
  - hwclock
  - bootloader
  - services-systemd
  - removeuser
  - finished
  - shellprocess
