---
# ArashiOS user defaults.
# Autologin stays off for the installed system, only the live session autologs.

defaultUser:
  # The live session user is "arashi" and is removed from the target system
  # by the removeuser job. The install account must use a different name.
  name: "arashios"
  fullName: "ArashiOS User"
  email: "user@arashios.local"
  groups:
    - audio
    - bluetooth
    - cdrom
    - dialout
    - dip
    - floppy
    - games
    - input
    - lpadmin
    - netdev
    - network
    - plugdev
    - scanner
    - sudo
    - video
  autologin: false
  shell: "/usr/bin/zsh"

defaultGroups:
  - audio
  - bluetooth
  - cdrom
  - dialout
  - dip
  - floppy
  - games
  - input
  - lpadmin
  - netdev
  - network
  - plugdev
  - scanner
  - sudo
  - video

doAutoLogin: false
autologinUser: ""
autologinGroup: ""
setHostName: true
writeUsername: true
userPassword: ""
rootPassword: ""
