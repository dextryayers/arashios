---
# ArashiOS partition defaults.
# Encryption is offered but not forced, the user decides in the partition view.

defaultFs: ext4
defaultPartitionType: primary
efiSystemPartition: true
efiSystemPartitionSize: 512M
efiMountPoint: /boot/efi
efiSystemPartitionFormat: false

# Swap is provided by zram on the installed system, so no swap partition is
# created by default.
swapSize: 0
swapSizeMin: 0
swapSizeMax: 0

# Disk selection
allowDisks: all
allowResizing: true
minimumDiskSize: 8G
reuseMountPoint: true

# Mount and automount
userAutoMount: true
autoMountCheckboxes: true
autoMountSelected: false

# LUKS2 encryption
luksFormatEnabled: true
luksFormatName: luks
luksFileSystem: ext4
luksVolumeName: cryptroot
luksOption: luks2
