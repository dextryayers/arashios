---
# ArashiOS bootloader configuration.
# grub.cfg is generated from the Kage theme already present in the image.

efiBootLoader: "grub-efi-amd64"
kernel: "/vmlinuz"
img: "/boot.img"
fallback: "/fallback.img"
timeout: "5"
bootloaderEntryName: "ArashiOS"
kernelLine: "quiet splash"
fallbackKernelLine: "quiet splash"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"

efiBootMgr: "efibootmgr"
efiBootloaderId: "arashios"
installEFIFallback: true
