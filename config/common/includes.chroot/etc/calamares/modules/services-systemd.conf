---
# ArashiOS systemd services for the installed system.
# The live session enables these services as well, the installed system keeps
# them so the daily driver workflow behaves the same after installation.

services:
  - name: NetworkManager.service
    mandatory: true
  - name: lightdm.service
    mandatory: true
  - name: bluetooth.service
    mandatory: false
  - name: avahi-daemon.service
    mandatory: false
  - name: fwupd.service
    mandatory: false
  - name: tlp.service
    mandatory: false
  - name: zram-swap.service
    mandatory: false
  - name: earlyoom.service
    mandatory: false
  - name: cups.socket
    mandatory: false

targets:
  - name: graphical.target
    mandatory: true

timers:
  - name: apt-daily.timer
    mandatory: false
  - name: apt-daily-upgrade.timer
    mandatory: false
  - name: fstrim.timer
    mandatory: false

disable:
  - name: ssh.service
    mandatory: false

mask:
  - name: ssh.socket
    mandatory: false
