---
# ArashiOS fstab defaults.

mountOptions:
  default: "defaults,noatime"

ssdExtraMountOptions:
  ext4: "defaults,noatime"
  btrfs: "defaults,noatime,compress=zstd"

efiMountOptions: "umask=0077,shortname=winnt"

crypttabOptions: "luks,discard,ssd,noatime"

tmpOptions:
  default:
    tmpfs: true
    options: "mode=1777,strictatime,nosuid,nodev,size=256M"
  ssd:
    tmpfs: true
    options: "mode=1777,strictatime,nosuid,nodev,size=1G"
