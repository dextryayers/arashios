# ArashiOS default container configuration.
# Semua container berjalan rootless dan tidak memakai privileged mode.

[containers]
cgroupns = "private"
events_logger = "file"
log_driver = "k8s-file"
log_max_size = "10m"
netns = "bridge"
no_hosts = false
pids_limit = 2048
userns = "keep-id"

[engine]
cgroup_manager = "systemd"
events_logger = "file"
runtime = "crun"

[engine.runtimes]
crun = [
    "/usr/bin/crun",
    { "annotation = 'io.containers.trace-syscall' }
]

[network]
default_rootful_network_cmd = "bridge"
network_backend = "netavark"
