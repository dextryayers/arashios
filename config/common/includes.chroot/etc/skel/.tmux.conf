# ArashiOS tmux defaults.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "screen-256color"
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
setw -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux reloaded"

set -g status-style "bg=#121216 fg=#EDE8DE"
set -g status-left "#[fg=#0A0A0C,bg=#DD785B,bold] #S #[default] "
set -g status-right "#[fg=#8B867D] %Y-%m-%d %H:%M "
setw -g window-status-current-style "fg=#DD785B,bold"
setw -g window-status-style "fg=#8B867D"
set -g pane-border-style "fg=#25252D"
set -g pane-active-border-style "fg=#DD785B"
set -g message-style "bg=#1B1B21,fg=#EDE8DE"
set -g mode-style "bg=#BF4432,fg=#070709"
