# ArashiOS NetworkManager policy.
# Settings are conservative and reviewed for the daily driver workflow.

[main]
plugins = ifupdown,keyfile
dns = default
rc-manager = systemd

[connectivity]
enabled = true
uri.enable = false
interval = 300

[device]
wifi.scan-rand-mac-address = stable
wifi.powersave = 2
wifi.2g4g.channel-auto=0
wired.2g4g.channel-auto=0

[connection]
ethernet.cloned-mac-address = stable
wifi.cloned-mac-address = stable
idempotence-timeout = 5000

[logging]
level = INFO
audit = false

[auth]
# No shared system wide credentials. Each user stores secrets in the keyring.
