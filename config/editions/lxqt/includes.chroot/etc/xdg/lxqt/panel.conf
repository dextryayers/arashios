panels=panel1

[panel1]
plugins=mainmenu,quicklaunch,taskbar,desktopswitch,statusnotifier,tray,volume,worldclock,showdesktop
position=Top
desktop=0
panelSize=30
iconSize=16
lineCount=1

[mainmenu]
type=mainmenu
filterClear=true

[quicklaunch]
type=quicklaunch
alignment=Left
apps\size=3
apps\1\desktop=/usr/share/applications/qterminal.desktop
apps\2\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\3\desktop=/usr/share/applications/firefox-esr.desktop

[desktopswitch]
type=desktopswitch
desktopNames=01, 02, 03, 04

[taskbar]
type=taskbar
buttonWidth=32
closeOnMiddleClick=true
groupingEnabled=true
showOnlyOneDesktop=true
showDesktopNames=false
raiseOnCurrentDesktop=true

[statusnotifier]
alignment=Right
type=statusnotifier

[tray]
type=tray

[volume]
alignment=Right
device=0
type=volume
showNotifications=false

[worldclock]
alignment=Right
type=worldclock
timeFormat=HH:mm
dateFormat=yyyy.MM.dd
showDate=false
showSeconds=false
showTimezone=false

[showdesktop]
alignment=Right
type=showdesktop
