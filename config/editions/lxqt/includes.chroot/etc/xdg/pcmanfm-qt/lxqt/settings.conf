[System]
IconThemeName=Papirus-Dark
FallbackIconThemeName=Papirus-Dark
SuCommand=lxsudo dbus-run-session -- %s
Archiver=lxqt-archiver
SIUnit=false
Terminal=qterminal

[Behavior]
BookmarkOpenMethod=0
UseTrash=true
SingleClick=false
ConfirmDelete=true

[Desktop]
DesktopShortcuts=
WallpaperMode=zoom
Wallpaper=/usr/share/backgrounds/arashios/kage-sumi.png
BgColor=#070709
FgColor=#ede8de
ShadowColor=#070709
ShowHidden=false
SortOrder=ascending
SortColumn=name
Font="Inter,10,-1,5,50,0,0,0,0,0"

[Volume]
MountOnStartup=true
MountRemovable=false
AutoRun=false

[FolderView]
Mode=detail
ShowHidden=false
SortOrder=ascending
SortColumn=name
BigIconSize=48
SmallIconSize=24
SidePaneIconSize=24
ThumbnailIconSize=128

[Window]
FixedHeight=600
FixedWidth=800
LastWindowHeight=720
LastWindowWidth=1080
RememberWindowSize=true
AlwaysShowTabs=false
ShowTabClose=true
SplitterPos=220
SidePaneMode=0

[Thumbnail]
ShowThumbnails=true
MaxThumbnailFileSize=4096
ThumbnailLocalFilesOnly=true
