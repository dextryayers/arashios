<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
  <title id="title">Kage Washi wallpaper</title>
  <desc id="desc">A light washi field with a faint ink ensō, paper fibers, and a vermilion seal.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F4EE"/>
      <stop offset="0.55" stop-color="#EDE8DE"/>
      <stop offset="1" stop-color="#D8D2C6"/>
    </linearGradient>
    <pattern id="fiber" width="180" height="5" patternUnits="userSpaceOnUse">
      <path d="M 0 4 L 180 2" fill="none" stroke="#8B867D" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="grain" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r="0.8" fill="#6B675F" opacity="0.10"/>
      <circle cx="17" cy="19" r="0.7" fill="#6B675F" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="3840" height="2160" fill="url(#paper)"/>
  <rect width="3840" height="2160" fill="url(#fiber)"/>
  <rect width="3840" height="2160" fill="url(#grain)"/>
  <circle cx="1000" cy="1080" r="720" fill="none" stroke="#121216" stroke-width="26" stroke-linecap="round" stroke-dasharray="3930 590" opacity="0.09" transform="rotate(-30 1000 1080)"/>
  <rect x="2880" y="1360" width="150" height="150" fill="#BF4432" opacity="0.92"/>
  <path d="M 2915 1462 L 2995 1382" fill="none" stroke="#F7F4EE" stroke-width="9" stroke-linecap="round" opacity="0.92"/>
  <path d="M 150 180 L 150 520" stroke="#BF4432" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  <path d="M 150 180 L 280 180" stroke="#BF4432" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
  <path d="M 170 1920 L 760 1920" stroke="#25252D" stroke-width="3" stroke-linecap="round" opacity="0.18"/>
</svg>
