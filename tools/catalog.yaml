  - {name: masscan, tier: T0, workflow: WF-01, category: recon, package: masscan, binary: masscan, license: debian, summary: "Pemindai port cepat pada jaringan besar."}
  - {name: arp-scan, tier: T0, workflow: WF-01, category: recon, package: arp-scan, binary: arp-scan, license: debian, summary: "Discovery layer dua pada jaringan lokal."}
  - {name: arping, tier: T0, workflow: WF-01, category: recon, package: arping, binary: arping, license: debian, summary: "Probe ARP untuk menemukan host aktif."}
  - {name: dnsutils, tier: T0, workflow: WF-01, category: recon, package: dnsutils, binary: dig, license: debian, summary: "Kueri DNS, NS, MX, dan zone transfer."}
  - {name: dnsrecon, tier: T0, workflow: WF-01, category: recon, package: dnsrecon, binary: dnsrecon, license: debian, summary: "Enumerasi DNS dan brute force subdomain."}
  - {name: dnsenum, tier: T0, workflow: WF-01, category: recon, package: dnsenum, binary: dnsenum, license: debian, summary: "Enumerasi server nama dan brute force."}
