schema_version: 1
catalog_version: "1.10.21"
updated: "2026-10-22"

# Katalog tool ArashiOS. Berkas ini adalah sumber kebenaran untuk seluruh
# tool yang boleh masuk ke image, untuk alur kerja yang dilayani, dan untuk
# aturan lisensi. Generator scripts/generate-toolstack.py mengubah katalog
# ini menjadi manifest per tool di vendor/manifests dan katalog runtime di
# config/common/includes.chroot/usr/share/arashios/toolstack/catalog.json.

workflows:
  WF-01: "Reconnaissance"
  WF-02: "Web testing"
  WF-03: "Exploitation"
  WF-04: "Password attack"
  WF-05: "Active Directory"
  WF-06: "Wireless"
  WF-07: "Network interception"
  WF-08: "Pivoting"
  WF-09: "Forensics"
  WF-10: "Reverse engineering"
  WF-11: "Cloud dan container"
  WF-12: "Reporting"

tiers:
  T0:
    source: "Debian bookworm"
    distribution: iso
    redistribution: "Diizinkan mengikuti lisensi paket Debian"
  T1:
    source: "Vendor upstream"
    distribution: vendor
    redistribution: "Diizinkan dengan atribusi dan berkas lisensi upstream"
  T2:
    source: "Unduhan oleh pengguna"
    distribution: installer
    redistribution: "Tidak didistribusikan dalam image"
  T3:
    source: "Container image"
    distribution: container
    redistribution: "Tidak didistribusikan dalam image"

licenses:
  debian: "Licen masing-masing paket Debian. Sumber: /usr/share/doc/<paket>/copyright"
  proprietary: "Proprietary. Tidak boleh didistribusikan ulang"

defaults:
  arch: [amd64, arm64, i386]
  role: security
  distribution: iso

tools:
  # WF-01 Reconnaissance
